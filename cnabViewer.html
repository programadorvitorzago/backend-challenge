            function parseCNAB() {
                console.log("Processando CNAB ...")
                var cnabInput = document.getElementById("cnabInput");
                montagem(cnabInput.value);

                var inputDiv = document.getElementById("input");
                inputDiv.hidden = true;
                var outputDiv = document.getElementById("output");
                outputDiv.hidden = false;
                
                // var cnabInput = document.getElementById("invisible");
                // montagem(cnabInput.innerText);
            }

            function montagem(textoCnab) {
                var outputDivElm = document.getElementById("output");
                var lines = textoCnab.split('\n');

                // MLHORAR ISSO HEIN
                var blocoSpec = cnabSpec.blocoTipoList;

                var blocoInit = false;
                var blocoElm = null;

                for (var i = 0; i < lines.length; i++) {
                    var tamLinha = 240;
                    lines[i] = lines[i].replace(/\r/g, ''); // remove carriage return if present
                    if (lines[i].trim() === '') {
                        continue; // skip empty lines
                    }

                    var divElm = document.createElement('div');
                    divElm.className = 'cnabLine';
                    
                    if( lines[i].length < tamLinha) {
                        lines[i] = lines[i].padEnd(tamLinha, ' ');
                    }

                    var line = lines[i];

                    // Indetificar Linha
                    var linhaTipo = getLinhaTipo(line);
                    if (linhaTipo != null) {
                        divElm.className = divElm.className + ' ' + linhaTipo.id;

                        // Iterar campos
                        var indexFim = 0;
                        for(var campoIndex in linhaTipo.campoList){
                            var campo = linhaTipo.campoList[campoIndex];
                            
                            var valorCampo = getValorCampo(line, campo.posicional)
                            console.log("Valor: " + valorCampo)
                            
                            var spanCampo = document.createElement('span');
                            spanCampo.className = campo.classe;
                            spanCampo.innerText = valorCampo;
                            
                            // def string de destaque e Dica
                            spanCampo.style = getStringDestaque(campo.destaque);
                            spanCampo.title = getDicaCampo(campo);
                            
                            divElm.appendChild(spanCampo);

                            indexFim = campo.posicional.fim;
                        }
                        // Restante
                        if (indexFim < tamLinha) {
                            var spanCampo = document.createElement('span');
                            spanCampo.className = "restante";
                            spanCampo.innerText = line.substring(indexFim, tamLinha);
                            divElm.appendChild(spanCampo);
                        }
                    }
                    else {
                        console.log('Tipo de linha não identificado: ' + line);
                        var spanCompleto = document.createElement('span');
                        spanCompleto.className = 'semIdentificacao';
                        spanCompleto.textContent = line;
                        divElm.appendChild(spanCompleto);
                    }

                    var elmAppender = outputDivElm;
                    if(blocoSpec) {
                        if(blocoInit) {
                            // verificar se tem que FECHAR
                            if(linhaTipo && blocoSpec.idLinhaFim == linhaTipo.id) {
                                console.log("Fechando bloco!");
                                blocoInit = false;
                                elmAppender = blocoElm;
                            }
                            else
                            {
                                // mantem no bloco
                                elmAppender = blocoElm;
                            }

                        }
                        else
                        {
                            // verificar se tem que abrir
                            if(linhaTipo && blocoSpec.idLinhaIni == linhaTipo.id) {
                                console.log("Abrindo bloco ...");
                                blocoInit = true;

                                var blockDivElm = document.createElement('div');
                                blockDivElm.className = 'cnabBloco';
                                blockDivElm.style = getStringDestaque(blocoSpec.destaque)
                                blocoElm = blockDivElm;
                                outputDivElm.appendChild(blockDivElm)
                                elmAppender = blocoElm;
                            }
                        }
                    }
                    elmAppender.appendChild(divElm);
                }
            }

            function getLinhaTipo(linha) {
                for (var i = 0; i < cnabSpec.linhaTipoList.length; i++) {
                    var linhaTipo = cnabSpec.linhaTipoList[i];
                    var match = true;

                    for (var j = 0; j < linhaTipo.identificacao.length; j++) {
                        var criterio = linhaTipo.identificacao[j];
                        var valorCampoCriterio = getValorCampo(linha, criterio);
                        var resultTesteCriterio = valorCampoCriterio == criterio.valor;
                        match = match && resultTesteCriterio;
                    }
                    if (match) {
                        return linhaTipo;
                    }
                }
                return null;
            }

            function getValorCampo(linha, identificacao) {
                return linha.substring(identificacao.ini - 1, identificacao.fim);
            }

            function getDicaCampo(campo) {
                if (campo.descricaoDetalhada) {
                    return campo.descricaoDetalhada;
                }
                if (campo.descricao) {
                    return campo.descricao;
                }
                return campo.nome;
            }
       
            function getStringDestaque(destaque) {
                if(destaque) {
                    var stringStyle = "";
                    if(destaque.color)
                    {
                        stringStyle += `background-color: ${destaque.color};`;
                    }
                    if(destaque.border)
                    {
                        stringStyle += `border: ${destaque.border};`;
                    }
                    return stringStyle;
                }
                return "";
            }
